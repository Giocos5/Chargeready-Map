<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ChargeReady Market Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { font-family: Arial, sans-serif; color: #17212b; }
    #map { background: #dce4e8; }
    #loading {
      position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center;
      background: rgba(21, 32, 43, .88); color: white; font-weight: 700;
    }
    #panel {
      position: fixed; z-index: 1200; top: 10px; right: 10px; width: 300px;
      max-height: calc(100vh - 20px); overflow: auto; background: rgba(255,255,255,.97);
      border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    #panel-title {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 12px; color: white; background: #2c3e50;
      font-size: 14px; font-weight: 700; border-radius: 8px 8px 0 0;
    }
    #collapse { border: 0; background: transparent; color: white; font-size: 18px; cursor: pointer; }
    #layers { padding-bottom: 6px; }
    .section-title {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 8px 10px; background: #e7ecef; border: 0; border-top: 1px solid #d1d8dc;
      color: #34495e; font-size: 10px; font-weight: 800; letter-spacing: .55px;
      text-transform: uppercase; cursor: pointer; text-align: left;
    }
    .section-title:hover { background: #d9e1e5; }
    .section-body.collapsed { display: none; }
    .layer { border-top: 1px solid #edf0f2; }
    .layer-row { display: flex; align-items: center; min-height: 34px; padding: 5px 9px; gap: 7px; }
    .layer-row input { width: 17px; height: 17px; flex: 0 0 auto; }
    .layer-row label { flex: 1; font-size: 12px; font-weight: 700; cursor: pointer; }
    .legend-toggle { border: 0; background: transparent; color: #566573; cursor: pointer; font-size: 12px; }
    .legend { display: none; padding: 0 12px 7px 34px; }
    .legend.open { display: block; }
    .legend-item { display: flex; align-items: center; gap: 7px; margin: 4px 0; font-size: 11px; }
    .swatch { width: 13px; height: 13px; border: 1px solid rgba(0,0,0,.5); flex: 0 0 auto; }
    .swatch.diamond { transform: rotate(45deg); width: 10px; height: 10px; margin: 2px; }
    .swatch.hatch-red { background: repeating-linear-gradient(135deg, transparent 0 3px, #e31a1c 3px 5px); }
    .swatch.hatch-green { background: repeating-linear-gradient(45deg, transparent 0 3px, #0bfc5f 3px 5px); }
    .swatch.hatch-blue { background: repeating-linear-gradient(135deg, transparent 0 3px, #0000ff 3px 5px); }
    .property-hover { white-space: normal; max-width: 290px; }
    .popup h3 { margin: 0 0 6px; color: #243b53; font-size: 14px; }
    .popup table { border-collapse: collapse; font-size: 12px; }
    .popup td { padding: 2px 6px 2px 0; vertical-align: top; }
    .popup td:first-child { font-weight: 700; color: #52606d; white-space: nowrap; }
    .property-marker { background: transparent; border: 0; }
    .property-marker span {
      display: block; width: 13px; height: 13px; transform: rotate(45deg);
      border: 1.5px solid white; box-shadow: 0 0 2px rgba(0,0,0,.8);
    }
    #errors { display: none; padding: 7px 10px; background: #fff3cd; color: #664d03; font-size: 11px; }
    @media (max-width: 650px) {
      #panel { width: min(290px, calc(100vw - 20px)); max-height: 60vh; }
      #panel.collapsed { width: 220px; }
      #panel.collapsed #layers, #panel.collapsed #errors { display: none; }
    }
  </style>
</head>
<body>
  <div id="loading">Loading the QGIS field map…</div>
  <div id="map"></div>
  <aside id="panel">
    <div id="panel-title"><span>ChargeReady Market Map</span><button id="collapse" aria-label="Collapse layers">▲</button></div>
    <div id="errors"></div>
    <div id="layers"></div>
  </aside>

  <script>
    const map = L.map('map', { center: [40.0, -89.2], zoom: 7, preferCanvas: false });

    const baseLayers = {
      google: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 18, attribution: 'Imagery © Google'
      }),
      twoGis: L.tileLayer('https://tile2.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1.1', {
        maxZoom: 18, attribution: '© 2GIS'
      })
    };
    baseLayers.google.addTo(map);

    const COMPOSITE = {
      '1 - T1 Hot':'#f2f212', '2 - T1 Warm':'#e585ad', '3 - T1 Cold':'#18db39',
      '4 - T2 Hot':'#d17127', '5 - T1 Ice':'#be75d8', '6 - T2 Monitor':'#38c9cb'
    };
    const EV_COUNTS = {
      '1 - Very High (300+)':'#12ff00', '2 - High (100-299)':'#76eddf',
      '3 - Moderate (25-99)':'#9a1ddd', '4 - Low (10-24)':'#4982ec',
      '5 - Very Low (<10)':'#4ddcaa'
    };
    const SF_HOUSING = {
      '1 - Low (<500)':'#688bd0', '2 - Medium (500-2,000)':'#db7de9',
      '3 - High (2,000-5,000)':'#5ed394', '4 - Very High (5,000+)':'#fa0000'
    };
    const EV_SCORE = {
      'T1|Hot':'#0000ff', 'T1|Warm':'#f5a623', 'T1|Cold':'#fad9b0',
      'T2|Hot':'#e1f402', 'T2|Warm':'#d5b43c', 'T2|Cold':'#729b6f'
    };
    const PROPERTY = {
      'Apartment Complex':'#1c1ae3', 'Mobile Home / MHC':'#f2f212',
      'Senior Living':'#44ca7e', 'Other':'#e2dd76'
    };

    const layers = {};
    const controls = {};
    let failures = 0;

    const definitions = [
      { section:'QGIS Layers', key:'mf', name:'Multifamily Complexes', file:'mf_prospects.geojson', on:true, pane:610,
        legend:Object.entries(PROPERTY), kind:'points' },
      { key:'sf', name:'Single Family Housing Density', file:'sf_housing.geojson', on:false, pane:520,
        legend:Object.entries(SF_HOUSING), kind:'sf' },
      { key:'evCounts', name:'Straight EV_Counts', file:'ev_counts.geojson', on:false, pane:510,
        legend:Object.entries(EV_COUNTS), kind:'evCounts' },
      { key:'composite', name:'Composite Priority Map', file:'zip_priority.geojson', on:false, pane:500,
        legend:Object.entries(COMPOSITE), kind:'composite' },
      { section:'EJC, CEJA, R3, Income', key:'ejc', name:'EJC_2026', file:'ejc.geojson', on:false, pane:470,
        legend:[['EJC_2026','#e31a1c','hatch-red']], kind:'ejc' },
      { key:'ceja', name:'CEJA_Adjacent', file:'ceja.geojson', on:false, pane:460,
        legend:[['CEJA_Adjacent','#0bfc5f','hatch-green']], kind:'ceja' },
      { key:'lmi', name:'Income Qualifying Areas', file:'lmi.geojson', on:false, pane:450,
        legend:[['Income Qualifying Areas','#d77a90']], kind:'lmi' },
      { key:'r3', name:'R3_Designated_Only', file:'r3.geojson', on:false, pane:440,
        legend:[['R3_Designated_Only','#0912ff']], kind:'r3' },
      { section:'Supporting Layers', key:'evScore', name:'EV Score- Demand + Trend', file:'zip_priority.geojson', on:false, pane:410,
        legend:[['T1 EIEC – Hot','#0000ff','hatch-blue'],['T1 EIEC – Warm','#f5a623'],['T1 EIEC – Cold','#fad9b0'],['T2 Non-EIEC – Hot','#e1f402'],['T2 Non-EIEC – Warm','#d5b43c'],['T2 Non-EIEC – Cold','#729b6f']], kind:'evScore' },
      { key:'nonEiec', name:'Non EIEC Area', file:'non_eiec.geojson', on:false, pane:400,
        legend:[['Non EIEC Area','#e31a1c']], kind:'nonEiec' },
      { key:'ameren', name:'Ameren_Territory — ameren_territory', file:'ameren_territory.geojson', on:false, pane:390,
        legend:[['Ameren Territory','#e31a1c']], kind:'ameren' },
      { key:'il', name:'IL_Boundary — tl_2025_us_state', file:'il_boundary.geojson', on:true, pane:380,
        legend:[['Illinois boundary','transparent']], kind:'il' }
    ];

    definitions.forEach(def => {
      map.createPane(def.key);
      map.getPane(def.key).style.zIndex = def.pane;
    });

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function show(value) { return value === null || value === undefined || value === '' ? '—' : escapeHtml(value); }
    function number(value) { return value === null || value === undefined ? '—' : Number(value).toLocaleString(); }
    function tablePopup(title, rows) {
      return `<div class="popup"><h3>${escapeHtml(title)}</h3><table>${rows.map(([a,b]) => `<tr><td>${escapeHtml(a)}</td><td>${b}</td></tr>`).join('')}</table></div>`;
    }
    function zipPopup(p) {
      return tablePopup(`ZIP ${show(p.ZIP)}`, [
        ['Priority',show(p.PRIORITY_CLASS)], ['Tier',show(p.PROGRAM_TIER)], ['Activity',show(p.ACTIVITY)],
        ['EV total',number(p.EV_TOTAL)], ['Composite score',show(p.COMBINED_SCORE)], ['SF units',number(p.SF_HU)],
        ['EJC',p.IS_EJC ? 'Yes' : 'No'], ['CEJA',p.IS_CEJA ? 'Yes' : 'No'], ['LMI',p.IS_LMI ? 'Yes' : 'No']
      ]);
    }
    function propertyPopup(p) {
      const website = p.WEBSITE ? `<a href="${escapeHtml(p.WEBSITE)}" target="_blank" rel="noopener">Open website</a>` : '—';
      return tablePopup(show(p.PROPERTY_NAME || 'Property'), [
        ['Type',show(p.PROPERTY_TYPE)], ['Address',show(p.ADDRESS)], ['City',show(p.CITY)], ['ZIP',show(p.ZIP)],
        ['Tier',show(p.TIER)], ['Activity',show(p.ACTIVITY)], ['Phone',show(p.PHONE)], ['Website',website]
      ]);
    }
    function simplePopup(title, p) {
      const rows = Object.entries(p).slice(0, 8).map(([key,value]) => [key,show(value)]);
      return tablePopup(title, rows);
    }

    function polygonStyle(def, p) {
      const base = { pane:def.key, weight:.8, color:'#232323', fillOpacity:.4 };
      if (def.kind === 'sf') return {...base, fillColor:SF_HOUSING[p.SF_CLASS] || '#beb297', fillOpacity:.5};
      if (def.kind === 'evCounts') return {...base, fillColor:EV_COUNTS[p.EV_CLASS] || '#beb297', fillOpacity:.4};
      if (def.kind === 'composite') return {...base, fillColor:COMPOSITE[p.PRIORITY_CLASS] || '#85b66f', fillOpacity:.4};
      if (def.kind === 'ejc') return {...base, color:'#e31a1c', weight:1.5, dashArray:'7 5', fillOpacity:0};
      if (def.kind === 'ceja') return {...base, color:'#0bfc5f', weight:1.5, dashArray:'7 5', fillOpacity:0};
      if (def.kind === 'lmi') return {...base, color:'#000', weight:.7, fillColor:'#d77a90', fillOpacity:.59};
      if (def.kind === 'r3') return {...base, color:'#232323', weight:1.2, fillColor:'#0912ff', fillOpacity:.397};
      if (def.kind === 'evScore') {
        const tier = String(p.PROGRAM_TIER || '').startsWith('T1') ? 'T1' : 'T2';
        return {...base, color:'#fff', weight:1.3, fillColor:EV_SCORE[`${tier}|${p.ACTIVITY}`] || '#729b6f', fillOpacity:.423};
      }
      if (def.kind === 'nonEiec') return {...base, color:'#fff', weight:2.5, fillColor:'#e31a1c', fillOpacity:1};
      if (def.kind === 'ameren') return {...base, color:'#232323', weight:1, fillColor:'#e31a1c', fillOpacity:1};
      if (def.kind === 'il') return {...base, color:'#fff', weight:2, fillOpacity:0};
      return base;
    }

    function createLayer(def, data) {
      if (def.kind === 'points') {
        return L.geoJSON(data, {
          pane:def.key,
          pointToLayer:(feature, latlng) => {
            const type = feature.properties.PROPERTY_TYPE || 'Other';
            const color = PROPERTY[type] || PROPERTY.Other;
            return L.marker(latlng, { pane:def.key, icon:L.divIcon({
              className:'property-marker', html:`<span style="background:${color}"></span>`, iconSize:[16,16], iconAnchor:[8,8]
            })});
          },
          onEachFeature:(feature, layer) => {
            const content = propertyPopup(feature.properties);
            layer.bindPopup(content, { maxWidth:310 });
            layer.bindTooltip(content, { sticky:true, direction:'top', opacity:.96, className:'property-hover' });
            layer.on('popupopen', () => layer.closeTooltip());
          }
        });
      }
      return L.geoJSON(data, {
        pane:def.key,
        style:feature => polygonStyle(def, feature.properties),
        onEachFeature:(feature, layer) => {
          const p = feature.properties;
          const content = ['sf','evCounts','composite','evScore'].includes(def.kind)
            ? zipPopup(p) : simplePopup(def.name, p);
          layer.bindPopup(content, { maxWidth:310 });
        }
      });
    }

    let activeSectionBody = null;
    function addSection(title, open = false) {
      const button = document.createElement('button');
      button.className = 'section-title';
      const text = document.createElement('span'); text.textContent = title;
      const arrow = document.createElement('span'); arrow.textContent = open ? '▼' : '▶';
      button.append(text, arrow);
      const body = document.createElement('div');
      body.className = `section-body${open ? '' : ' collapsed'}`;
      button.onclick = () => {
        body.classList.toggle('collapsed');
        arrow.textContent = body.classList.contains('collapsed') ? '▶' : '▼';
      };
      document.getElementById('layers').append(button, body);
      activeSectionBody = body;
    }
    function addLayerControl(def) {
      if (def.section) addSection(def.section);
      const wrap = document.createElement('div');
      wrap.className = 'layer';
      const row = document.createElement('div');
      row.className = 'layer-row';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox'; checkbox.id = `check-${def.key}`; checkbox.checked = def.on; checkbox.disabled = true;
      const label = document.createElement('label');
      label.htmlFor = checkbox.id; label.textContent = def.name;
      const toggle = document.createElement('button');
      toggle.className = 'legend-toggle'; toggle.textContent = '▶'; toggle.title = 'Show legend';
      const legend = document.createElement('div');
      legend.className = 'legend';
      def.legend.forEach(([name,color,pattern]) => {
        const item = document.createElement('div'); item.className = 'legend-item';
        const swatch = document.createElement('span');
        swatch.className = `swatch${def.kind === 'points' ? ' diamond' : ''}${pattern ? ` ${pattern}` : ''}`;
        if (!pattern) swatch.style.background = color;
        item.append(swatch, document.createTextNode(name)); legend.appendChild(item);
      });
      toggle.onclick = () => { legend.classList.toggle('open'); toggle.textContent = legend.classList.contains('open') ? '▼' : '▶'; };
      checkbox.onchange = () => {
        if (!layers[def.key]) return;
        checkbox.checked ? layers[def.key].addTo(map) : map.removeLayer(layers[def.key]);
      };
      row.append(checkbox,label,toggle); wrap.append(row,legend); activeSectionBody.appendChild(wrap);
      controls[def.key] = checkbox;
    }

    definitions.forEach(addLayerControl);
    addSection('Basemaps');
    ['google','twoGis'].forEach((key,index) => {
      const row = document.createElement('div'); row.className = 'layer-row';
      const radio = document.createElement('input'); radio.type='radio'; radio.name='basemap'; radio.id=`base-${key}`; radio.checked=index===0;
      const label = document.createElement('label'); label.htmlFor=radio.id; label.textContent=key==='google' ? 'Google Hybrid' : '2gis Map';
      radio.onchange=()=>{ Object.values(baseLayers).forEach(layer=>map.removeLayer(layer)); baseLayers[key].addTo(map); };
      row.append(radio,label); activeSectionBody.appendChild(row);
    });

    document.getElementById('collapse').onclick = () => {
      const panel = document.getElementById('panel'); panel.classList.toggle('collapsed');
      document.getElementById('collapse').textContent = panel.classList.contains('collapsed') ? '▼' : '▲';
    };

    Promise.allSettled(definitions.map(async def => {
      const response = await fetch(def.file);
      if (!response.ok) throw new Error(`${def.name}: ${response.status}`);
      const data = await response.json();
      layers[def.key] = createLayer(def, data);
      controls[def.key].disabled = false;
      if (def.on) layers[def.key].addTo(map);
    })).then(results => {
      const errors = results.filter(result => result.status === 'rejected');
      failures = errors.length;
      if (failures) {
        const box = document.getElementById('errors'); box.style.display='block';
        box.textContent = `${failures} layer${failures === 1 ? '' : 's'} could not be loaded.`;
        errors.forEach(error => console.error(error.reason));
      }
      document.getElementById('loading').style.display='none';
    });
  </script>
</body>
</html>
